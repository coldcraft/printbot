services:
  printbot:
    build: .
    container_name: printbot
    ports:
      - "8000:8000"
    environment:
      - TEXTBEE_WEBHOOK_KEY=${TEXTBEE_WEBHOOK_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - PRINTER_IP=${PRINTER_IP}
      - PRINTER_PORT=${PRINTER_PORT:-9100}
      - PRINTER_TIMEZONE=${PRINTER_TIMEZONE:-UTC}
      - LOG_DIR=${LOG_DIR:-/logs}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - RATE_LIMIT_MESSAGES=${RATE_LIMIT_MESSAGES:-5}
      - RATE_LIMIT_WINDOW_MINUTES=${RATE_LIMIT_WINDOW_MINUTES:-3}
      - RATE_LIMIT_COOLDOWN_MINUTES=${RATE_LIMIT_COOLDOWN_MINUTES:-15}
      - MAX_MESSAGE_CHARS=${MAX_MESSAGE_CHARS:-1500}
      - CONTACTS_PATH=${CONTACTS_PATH:-/app/config/contacts.json}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TEXTBEE_API_KEY=${TEXTBEE_API_KEY}
      - TEXTBEE_DEVICE_ID=${TEXTBEE_DEVICE_ID}
      - SMSGATE_SIGNING_KEY=${SMSGATE_SIGNING_KEY:-}
      - SMSGATE_BASE_URL=${SMSGATE_BASE_URL:-}
      - SMSGATE_USERNAME=${SMSGATE_USERNAME:-}
      - SMSGATE_PASSWORD=${SMSGATE_PASSWORD:-}
    volumes:
      - ./logs:/logs
      - ./config:/app/config
    networks:
      - printbot_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  printbot_network:
    driver: bridge
